<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gowithme.club</title>
<style>
/* Values from gowithme.club's tokens.css; the page stays self-contained
   because the console may be offline, and the console's browser is not
   assumed to know color-mix(), aspect-ratio or flex gap. */
:root {
  --background: #16181a;
  --surface: #202225;
  --line: #ffffff24;
  --text: #f2f3f4;
  --muted: #9a9ea3;
  --brand: #c7f547;
  /* color-mix(in srgb, white 12%, --brand), as the site's primary hover */
  --brand-hover: #cef65d;
  --warning: #ffb86f;
  --white: #ffffff;
  --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --radius-control: 0.5rem;
  --radius-surface: 1rem;
  --dur-1: 150ms;
  --dur-2: 260ms;
  --ease-out: cubic-bezier(0.25, 1, 0.5, 1);
  /* Read from a couch: the scale follows the browser window, which the
     console opens over the home screen rather than full screen. */
  font-size: clamp(14px, min(1.45vw, 2.7vh), 30px);
  --qr: clamp(160px, min(28vw, 48vh), 480px);
  /* The layout's right column keeps this width in every state, so the
     header and the footer never move; a smaller QR code sits inside it. */
  --qr-col: clamp(160px, min(28vw, 48vh), 480px);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  /* The same room above and below: the bottom band must not sit on the
     window's edge. */
  padding: clamp(1rem, 5vh, 3rem) clamp(1.5rem, 5vw, 4.5rem);
  background: var(--background);
  color: var(--text);
  font: 400 1rem/1.4 var(--font-main);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
::selection { background: var(--brand); color: var(--background); }

.wordmark { display: block; width: auto; height: 1.6rem; }

.stage {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 0;
}
/* One centred column for every state: the text, the gap, the QR code. The
   header and the footer keep its edges. */
:root { --col: 34rem; --gap: clamp(3rem, 7vw, 7rem); }
header, .stage, .hello, .foot { width: 100%; max-width: calc(var(--col) + var(--gap) + var(--qr-col)); margin-left: auto; margin-right: auto; }
.copy { flex: 0 1 auto; max-width: var(--col); margin-right: var(--gap); }

h1 {
  margin: 0;
  font-weight: 700;
  font-size: 2.6rem;
  line-height: 1.06;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.lead { margin: 0.9rem 0 0; color: var(--muted); font-size: 1.2rem; line-height: 1.45; }
.lead b { color: var(--text); font-weight: 600; }

/* Not linked yet. Linking leads, near the middle where the eye and the
   stick cursor start; what the service is stays in the footer. */
.intro h1 { font-size: 3rem; line-height: 1.05; letter-spacing: -0.025em; }

/* Linked: the owner's name heads the page and what this console recorded is
   the content, so its QR code steps back to a smaller, secondary route. */
.linked { --qr: clamp(160px, min(17vw, 34vh), 320px); }
.status { display: flex; align-items: center; margin: 1rem 0 0; font-size: 1.15rem; }
.status.late { color: var(--warning); }
.dot { flex: none; width: 0.6rem; height: 0.6rem; margin-right: 0.65rem; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--brand); box-shadow: 0 0 0 0 #c7f54766; animation: live 2.6s var(--ease-out) infinite; }
.dot.late { background: var(--warning); }
@keyframes live { 0% { box-shadow: 0 0 0 0 #c7f54766; } 70%, 100% { box-shadow: 0 0 0 0.6rem #c7f54700; } }
/* What the console recorded: large numbers, quiet units, a label after. */
.recorded { margin: 1.6rem 0 0; color: var(--muted); font-size: 1.35rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.recorded b { color: var(--text); font-size: 1.6em; font-weight: 700; letter-spacing: -0.02em; }
/* Groups apart, so "73 h" and "42 games" read as two figures. */
.recorded .sep { margin: 0 0.75em; color: #5d6166; }
.recorded-label { margin: 0.35rem 0 0; color: var(--muted); font-size: 1rem; }


.actions { margin-top: 1.8rem; }
/* Sized for a cursor steered with a stick: a big target, and a ring on
   hover so it is clear before the press that the press will land. */
.button {
  display: inline-flex;
  align-items: center;
  min-height: 3.5rem;
  padding: 0 2.1rem;
  border: 2px solid var(--brand);
  border-radius: var(--radius-control);
  background: var(--brand);
  color: var(--background);
  font: 700 1.15rem/1 var(--font-main);
  text-decoration: none;
  cursor: pointer;
  transition: background-color var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out);
}
.button:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
.button:focus { outline: none; }
.button:hover, .button:focus-visible { outline: 3px solid var(--brand); outline-offset: 4px; }
.button[disabled] { opacity: 0.6; cursor: default; }
/* Hidden buttons stay in the markup: space only between visible ones. */
.button:not([hidden]) ~ .button { margin-left: 1rem; }

.qr { flex: none; margin: 0; text-align: center; }
.qr-well {
  width: var(--qr);
  height: var(--qr);
  border-radius: var(--radius-surface);
  background: var(--white);
  overflow: hidden;
  box-shadow: 0 1.2rem 2.5rem -1rem #00000099;
}
.qr-well svg { display: block; width: 100%; height: 100%; }
.qr-well.wait { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); animation: waiting 1.4s ease-in-out infinite alternate; }
@keyframes waiting { to { background: #2a2d31; } }
.qr-well.fresh svg { animation: appear var(--dur-2) var(--ease-out); }
@keyframes appear { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }
.qr figcaption { max-width: var(--qr); margin: 0.9rem auto 0; color: var(--muted); font-size: 1rem; line-height: 1.4; }
.qr figcaption b { color: var(--text); font-weight: 600; }

/* Where a QR code would stand, the tile's gamepad, quiet, so a text-only
   state keeps the layout's balance. */
.emblem { flex: none; width: var(--qr-col); }
.emblem svg { display: block; width: 100%; height: auto; fill: #1f2924; }

/* The code under its QR code: two ways to the same step. */
.code {
  display: flex;
  justify-content: center;
  margin: 1rem 0 0;
  font: 600 2.8rem/1 var(--font-mono);
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}
.code span + span { margin-left: 0.35em; }

/* One row under a hairline, two groups on the column's edges: what the
   service is and where it reads from and reports to on the left, the build
   on the right. Text and marks share one colour and one height. */
.foot {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 0.9rem;
  border-top: 1px solid var(--line);
  color: var(--muted);
}
.about { display: flex; align-items: center; min-width: 0; }
.slogan { margin: 0 1.6rem 0 0; font-size: 0.95rem; white-space: nowrap; }
.marks { display: flex; align-items: center; }
.marks svg { display: block; width: auto; height: 1.15rem; margin-right: 1rem; }
.marks svg:last-child { margin-right: 0; }
.marks svg, .marks svg path { fill: currentColor; }

/* The build, linked to the repository. A big target for the stick cursor,
   quiet until it is under it; the negative margin keeps its text on the
   column's edge. */
.source {
  display: inline-flex;
  align-items: center;
  flex: none;
  min-height: 2.4rem;
  margin: 0 -0.5rem 0 1.6rem;
  padding: 0 0.5rem;
  border-radius: var(--radius-control);
  color: var(--muted);
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
  text-decoration: none;
  transition: color var(--dur-1) var(--ease-out);
}
.source svg { width: 1.15rem; height: 1.15rem; margin-right: 0.5em; }
.source:hover { color: var(--text); }
.source:focus { outline: none; }
.source:hover, .source:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

/* The first visit, until its button is pressed (web.h): what the service
   does and one way on. The diagram is the landing's own, framed from
   gowithme.club/embed/flow rather than copied, so the two never drift. It is
   laid out wide, as on the landing, and scaled down to fit; it shows once the
   framed page says it is ready, so an error page never does. */
.hello { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; min-height: 0; transition: opacity 220ms var(--ease-out); }
.hello.out { opacity: 0; }
.hello .copy { display: flex; align-items: center; justify-content: space-between; gap: 2rem; max-width: none; margin-right: 0; }
.hello h1 { font-size: 1.7rem; line-height: 1.15; letter-spacing: -0.02em; }
.hello .actions { flex: none; margin-top: 0; }
.hello h1, .hello .actions, .stage.enter .copy, .stage.enter .qr, .stage.enter .emblem { animation: rise 640ms var(--ease-out) both; }
.hello .actions { animation-delay: 90ms; }
@keyframes rise { from { opacity: 0; transform: translateY(0.8rem); } }
.flow { position: relative; flex: none; margin: 1.3rem auto 0; overflow: hidden; }
.flow iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; pointer-events: none; opacity: 0; transition: opacity 400ms var(--ease-out); }
.flow iframe.on { opacity: 1; }

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

// "73 h · 42 games · 318 trophies", numbers in bold. From an hour on, time
// is rounded to whole hours; under an hour it is minutes (owner's choice,
// 2026-11-26). Empty while nothing is recorded or
// the server sends no totals.
function recordedHtml(r) {
  if (!r || !(r.seconds > 0 || r.trophies > 0)) return "";

  function grouped(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0"); }

function ago(s) {

// The nickname is the last part of the profile address.

// Rows of 0 and 1 become one path of horizontal runs, with the quiet zone

function qrSvg(rows, label) {
  var n = rows.length, q = 3, d = "";

      var w = 1;

      x += w - 1;

    else showQr(undefined);
  } else if (state === "claim") {
    // The console is linked, but the profile signed in is nobody's on the
    // site: someone other than the owner is playing. Their code, as for
    // linking the console, at the same address.
    document.body.className = "intro";
    text("title", T.claim(s.profile));
    if (s.code) {
      html("lead", T.scan);
      showQr(s.qr, s.code, "", T.qrCode);
      html("code", "<span>" + s.code.slice(0, 3) + "</span><span>" + s.code.slice(3) + "</span>");
      $("code").setAttribute("aria-label", s.code.split("").join(" "));
    } else {
      text("lead", "");
      showQr(null, "", T.getting);
    }
  } else if (state === "offline" || state === "down") {
    text("title", state === "down" ? T.down : T.offline);
    text("lead", state === "down" ? T.downText : T.offlineText);
    showQr(undefined);
  } else {
    // Not linked yet, maybe by someone who found the payload in a list:
    // the step, then what the service is in the footer.
    document.body.className = "intro";
    text("title", T.link);
    if (state === "code" && s.code) {
      html("lead", T.scan);
      showQr(s.qr, s.code, "", T.qrCode);
      html("code", "<span>" + s.code.slice(0, 3) + "</span><span>" + s.code.slice(3) + "</span>");
      $("code").setAttribute("aria-label", s.code.split("").join(" "));
    } else if (state === "stopped") {
      text("lead", "");
      pair.textContent = T.showCode;
      pair.hidden = false;
      showQr(undefined);
      // Opening the tile is the wish to link: ask for a code once, without
      // making the cursor travel to the button.
      if (!asked) { asked = true; askForCode(); }
    } else {
      text("lead", "");
      showQr(null, "", T.getting);
    }
  }
  $("actions").hidden = open.hidden && pair.hidden;
}

var first = true, misses = 0, asked = false;

function load() {
  var url = "/state?lang=" + (ru ? "ru" : "en");
  // The first request tells the log what the console's browser looks like.
  if (first) url += "&first=1&vw=" + window.innerWidth + "&vh=" + window.innerHeight;
  first = false;
  fetch(url, { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (s) { misses = 0; last = s; render(s); }, function () {
      // A new copy takes over the port within seconds: one miss is that,
      // two in a row mean the tracker is gone.
      if (++misses >= 2) render({ state: "down" });
    })
    .then(function () { setTimeout(load, 3000); });
}

function askForCode() {
  var pair = $("pair");
  pair.disabled = true;
  fetch("/pair", { method: "POST" })
    .catch(function () {})
    .then(function () { pair.disabled = false; render({ state: "connecting" }); });
}

$("pair").addEventListener("click", askForCode);

$("helloTitle").textContent = T.helloTitle;
$("helloGo").textContent = T.helloGo;
window.addEventListener("resize", fitFlow);

// On to linking: the welcome fades and the page it covered rises.
$("helloGo").addEventListener("click", function () {
  if (welcomed) return;
  welcomed = true;
  fetch("/welcome", { method: "POST" }).catch(function () {});
  $("hello").className = "hello out";
  setTimeout(function () {
    $("hello").className = "hello";
    $("stage").className = "stage enter";
    render(last || { state: "connecting" });
  }, 220);
});

load();
</script>
</body>
</html>
